# MSS Platform Authentication Configuration
# Copy this file to mss_auth.yaml and fill in credentials.
# mss_auth.yaml is gitignored and will NOT be committed.

profiles:
  # Example: Login-based authentication
  mss_prod:
    base_url: "https://mss.example.com"
    auth_type: "login"  # login | token | basic | env
    login_url: "/api/v1/auth/login"
    login_body:
      username: "YOUR_USERNAME"
      password: "YOUR_PASSWORD"
    token_path: "$.data.token"       # JSONPath to extract token from login response
    token_header: "Authorization"     # Header name for token
    token_prefix: "Bearer "           # Prefix added before token value

  # Example: Static API token
  mss_dev:
    base_url: "https://mss-dev.example.com"
    auth_type: "token"
    static_token: "YOUR_API_TOKEN"
    token_header: "X-API-Key"
    token_prefix: ""

  # Example: Environment variable token
  mss_ci:
    base_url: "https://mss-ci.example.com"
    auth_type: "env"
    env_var: "MSS_API_TOKEN"
    token_header: "Authorization"
    token_prefix: "Bearer "
